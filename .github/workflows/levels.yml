name: NQ session levels

on:
  schedule:
    - cron: "40 10 * * 1-5"
    - cron: "5 11 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  levels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python levels.py
      - name: Commit levels.json
        run: |
          git config user.name "nq-levels-bot"
          git config user.email "actions@users.noreply.github.com"
          git add levels.json
          git diff --cached --quiet || git commit -m "levels $(date -u +%F)"
          git push
